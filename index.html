<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المفاوض الذكي الناطق | تجربة المساومة الحية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --card: rgba(25, 25, 28, 0.88);
      --gold: #d4af37;
      --burgundy: #6b1d2f;
      --text: #f5f5f5;
      --muted: #a0a0a0;
    }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1a0b10 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .product-header {
      padding: 20px;
      background: linear-gradient(135deg, rgba(107, 29, 47, 0.45), rgba(5, 5, 5, 0.92));
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      text-align: center;
      position: relative;
    }
    .sound-toggle {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--gold);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 16px;
    }
    .badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .product-title { margin: 4px 0; font-size: 20px; font-weight: 800; }
    .product-desc { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
    .price { font-size: 26px; font-weight: 800; color: var(--gold); }
    .chat-box {
      height: 330px;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      animation: fadeIn 0.3s ease;
    }
    .msg.bot {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom-right-radius: 4px;
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--burgundy), #4a1220);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-bottom-left-radius: 4px;
    }
    .deal-card {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(107, 29, 47, 0.4));
      border: 1px solid var(--gold);
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      margin-top: 8px;
    }
    .deal-btn {
      display: inline-block;
      margin-top: 10px;
      background: var(--gold);
      color: #000;
      font-weight: 800;
      padding: 10px 22px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
    }
    .input-area {
      display: flex;
      gap: 6px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.65);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    input {
      flex: 1;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--gold); }
    button.mic-btn {
      background: rgba(255, 255, 255, 0.1);
      color: var(--gold);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 14px;
      padding: 0 14px;
      font-size: 18px;
      cursor: pointer;
    }
    button.mic-btn.recording {
      background: #c0392b;
      color: #fff;
      animation: pulse 1s infinite;
    }
    button.send-btn {
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 0 16px;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

<div class="container">
  <div class="product-header">
    <button class="sound-toggle" id="soundBtn" onclick="toggleSound()" title="تشغيل/كتم الصوت">🔊</button>
    <span class="badge">إصدار محدود • قطن فاخر 260 GSM</span>
    <h1 class="product-title">تيشيرت أوفر سايز — إصدار خاص</h1>
    <p class="product-desc">قصة بوكسي عصرية مع طباعة عالية الدقة وتغليف فاخر</p>
    <span class="price">150 ريال</span>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg bot">
      يا هلا ومرحبا! 👋 أعجبك التيشيرت؟ السعر الرسمي 150 ريال، لكن تقدر تكاسرني بالكتابة أو بالصوت 🎤.. عطني سومتك!
    </div>
  </div>

  <div class="input-area">
    <button class="mic-btn" id="micBtn" onclick="startVoiceInput()" title="تحدث بصوتك">🎤</button>
    <input type="text" id="userInput" placeholder="اكتب أو اضغط المايك وساوم..." onkeypress="if(event.key==='Enter') sendMessage()" />
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">إرسال</button>
  </div>
</div>

<script>
  const WORKER_URL = "https://sales-negotiator.ibn-alnamer.workers.dev";
  const WHATSAPP_NUMBER = "966502777884";
  let isSoundOn = true;

  const productData = {
    name: "تيشيرت أوفر سايز — إصدار خاص",
    listPrice: 150
  };

  let chatHistory = [
    { role: "bot", text: "يا هلا ومرحبا! 👋 أعجبك التيشيرت؟ السعر الرسمي 150 ريال، لكن تقدر تكاسرني بالكتابة أو بالصوت 🎤.. عطني سومتك!" }
  ];

  function toggleSound() {
    isSoundOn = !isSoundOn;
    document.getElementById("soundBtn").textContent = isSoundOn ? "🔊" : "🔇";
  }

  function playAudio(base64Audio, fallbackText) {
    if (!isSoundOn) return;
    if (base64Audio) {
      const audio = new Audio("data:audio/mpeg;base64," + base64Audio);
      audio.play().catch(() => speakFallback(fallbackText));
    } else {
      speakFallback(fallbackText);
    }
  }

  function speakFallback(text) {
    if (!isSoundOn || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text.replace(/\[DEAL_ACCEPTED:\s*\d+\]/g, ""));
    utterance.lang = "ar-SA";
    window.speechSynthesis.speak(utterance);
  }

  function startVoiceInput() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("متصفحك لا يدعم الإدخال الصوتي المباشر، يمكنك الكتابة.");
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = "ar-SA";
    const micBtn = document.getElementById("micBtn");

    recognition.onstart = () => micBtn.classList.add("recording");
    recognition.onend = () => micBtn.classList.remove("recording");
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      document.getElementById("userInput").value = transcript;
      sendMessage();
    };
    recognition.start();
  }

  async function sendMessage() {
    const input = document.getElementById("userInput");
    const btn = document.getElementById("sendBtn");
    const text = input.value.trim();
    if (!text) return;

    appendMessage("user", text);
    chatHistory.push({ role: "user", text });
    input.value = "";
    btn.disabled = true;

    const typingDiv = appendMessage("bot", "جاري التفكير في عرضك... ⏳");

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: chatHistory, product: productData })
      });

      const data = await res.json();
      typingDiv.remove();

      let botReply = data.reply;
      const dealMatch = botReply.match(/\[DEAL_ACCEPTED:\s*(\d+)\]/);

      if (dealMatch) {
        const agreedPrice = dealMatch[1];
        botReply = botReply.replace(dealMatch[0], "").trim();
        appendMessage("bot", botReply);
        showDealCard(agreedPrice);
      } else {
        appendMessage("bot", botReply);
      }

      playAudio(data.audio, botReply);
      chatHistory.push({ role: "bot", text: botReply });
    } catch (err) {
      typingDiv.textContent = "تعذر الاتصال حالياً، تأكد من اتصال الإنترنت.";
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  function appendMessage(sender, text) {
    const chatBox = document.getElementById("chatBox");
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  function showDealCard(price) {
    const chatBox = document.getElementById("chatBox");
    const card = document.createElement("div");
    card.className = "deal-card";
    const whatsappMsg = encodeURIComponent(`مرحباً، اتفقت مع المساعد الذكي على شراء (${productData.name}) بسعر خاص: ${price} ريال.`);
    card.innerHTML = `
      <div style="font-weight:800; color:#d4af37; font-size:16px;">🎉 تم اعتماد الصفقة: ${price} ريال</div>
      <div style="font-size:12px; color:#ccc; margin-top:4px;">العرض صالح لمدة 15 دقيقة فقط</div>
      <a class="deal-btn" href="https://wa.me/${WHATSAPP_NUMBER}?text=${whatsappMsg}" target="_blank">إتمام الطلب عبر واتساب ⬅️</a>
    `;
    chatBox.appendChild(card);
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>

</body>
</html>
